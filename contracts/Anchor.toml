[toolchain]
anchor_version = "0.30.1"
solana_version = "1.18.26"

[features]
resolution = true
skip-lint = false

[programs.localnet]
orion_protocol = "9yX2d3V9R93UP1Pv4kNzHp5Foas4xTEdJneiKEM2aVTS"

[programs.devnet]
orion_protocol = "9yX2d3V9R93UP1Pv4kNzHp5Foas4xTEdJneiKEM2aVTS"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "devnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "yarn run ts-mocha -p ./tsconfig.json -t 1000000 tests/**/*.ts"
seed = "yarn run ts-node scripts/seed_devnet.ts"
