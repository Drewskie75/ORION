[package]
name = "orion_protocol"
version = "0.1.0"
description = "Orion RWA Protocol Smart Contracts on Solana"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "orion_protocol"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []

[dependencies]
anchor-lang = { version = "0.30.1", features = ["init-if-needed"] }
anchor-spl = { version = "0.30.1", features = ["token", "mint"] }
pyth-sdk-solana = "0.10.1"
